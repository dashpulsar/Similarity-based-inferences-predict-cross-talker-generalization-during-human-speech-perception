[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-talker-generalization"
version = "0.1.0"
description = "Computational SBI and exposure-variability analyses of human cross-talker speech generalization"
requires-python = ">=3.9,<3.12"
dependencies = [
  "h5py==3.14.0",
  "joblib==1.5.2",
  "matplotlib==3.9.4",
  "numba==0.60.0",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scikit-learn==1.6.1",
  "scipy==1.13.1",
  "seaborn==0.13.2",
  "threadpoolctl==3.6.0",
]

[project.scripts]
ctg = "ctg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
